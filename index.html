<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni Marburg Jobs Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --bg-elevated: #12121a;
  --bg-card: #1a1a26;
  --bg-card-hover: #22222f;
  --border: #2a2a3a;
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --text-muted: #555568;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --accent-glow: rgba(108, 92, 231, 0.15);
  --green: #00b894;
  --orange: #f39c12;
  --red: #e74c3c;
  --pink: #fd79a8;
  --cyan: #00cec9;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.logo {
  font-size: 1.25rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent-light), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

.search-box {
  flex: 1;
  min-width: 200px;
  max-width: 400px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 0.6rem 1rem 0.6rem 2.5rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.875rem;
  font-family: inherit;
  outline: none;
  transition: var(--transition);
}

.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-box svg {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}

.header-stats {
  display: flex;
  gap: 1.5rem;
  margin-left: auto;
}

.header-stat {
  text-align: center;
}

.header-stat-value {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--accent-light);
}

.header-stat-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

/* Layout */
.layout {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 1.5rem;
  min-height: calc(100vh - 65px);
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }
}

/* Sidebar */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.panel-header {
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-body {
  padding: 0.5rem;
  max-height: 400px;
  overflow-y: auto;
}

/* Source chips */
.source-chip {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.5rem 0.625rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
  font-size: 0.8125rem;
}

.source-chip:hover {
  background: var(--bg-card-hover);
}

.source-chip.active {
  background: var(--accent-glow);
}

.source-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.source-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-dim);
  transition: var(--transition);
}

.source-chip.active .source-name {
  color: var(--text);
}

.source-count {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg-elevated);
  padding: 0.125rem 0.5rem;
  border-radius: 99px;
  flex-shrink: 0;
}

.source-chip.active .source-count {
  background: var(--accent);
  color: white;
}

/* Date filter */
.date-inputs {
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.date-inputs label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.date-inputs input[type="date"] {
  width: 100%;
  padding: 0.5rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 0.8125rem;
  outline: none;
  transition: var(--transition);
}

.date-inputs input[type="date"]:focus {
  border-color: var(--accent);
}

.clear-btn {
  margin: 0.5rem 0.75rem 0.75rem;
  padding: 0.4rem 0.75rem;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.75rem;
  cursor: pointer;
  transition: var(--transition);
}

.clear-btn:hover {
  border-color: var(--red);
  color: var(--red);
}

/* Main content */
.main {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* Charts */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}

@media (max-width: 700px) {
  .charts-grid {
    grid-template-columns: 1fr;
  }
}

.chart-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
}

.chart-panel h3 {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
}

.chart-container {
  position: relative;
  height: 220px;
}

/* Jobs list */
.jobs-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.5rem;
}

.jobs-header h2 {
  font-size: 1rem;
  font-weight: 600;
}

.jobs-count {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.jobs-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.job-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 1rem;
  align-items: center;
  transition: var(--transition);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

.job-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.job-source-badge {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.job-info {
  min-width: 0;
}

.job-title {
  font-size: 0.875rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.job-meta {
  display: flex;
  gap: 1rem;
  margin-top: 0.25rem;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.job-meta span {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.job-deadline {
  text-align: right;
  flex-shrink: 0;
}

.deadline-date {
  font-size: 0.8125rem;
  font-weight: 600;
}

.deadline-status {
  font-size: 0.6875rem;
  margin-top: 0.125rem;
}

.deadline-future { color: var(--green); }
.deadline-soon { color: var(--orange); }
.deadline-past { color: var(--red); }

.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}

.empty-state svg {
  width: 48px;
  height: 48px;
  margin-bottom: 1rem;
  opacity: 0.3;
}

.empty-state p {
  font-size: 0.875rem;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.job-card {
  animation: fadeIn 0.3s ease both;
}

/* Responsive */
@media (max-width: 600px) {
  .header-inner { gap: 0.75rem; }
  .header-stats { gap: 1rem; }
  .header-stat-value { font-size: 1rem; }
  .layout { padding: 1rem; gap: 1rem; }
  .job-card { padding: 0.875rem 1rem; }
}

/* Fetch date filter */
.fetch-chips {
  padding: 0.5rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem;
}

.fetch-chip {
  padding: 0.3rem 0.625rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 0.6875rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.fetch-chip:hover {
  border-color: var(--accent);
}

.fetch-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* Toggle charts */
.toggle-charts {
  padding: 0.5rem 0.75rem;
  display: flex;
  gap: 0.5rem;
  border-top: 1px solid var(--border);
}

.toggle-btn {
  flex: 1;
  padding: 0.4rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.75rem;
  cursor: pointer;
  transition: var(--transition);
}

.toggle-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">Uni Jobs</div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search jobs...">
    </div>
    <div class="header-stats">
      <div class="header-stat">
        <div class="header-stat-value" id="totalJobs">0</div>
        <div class="header-stat-label">Total</div>
      </div>
      <div class="header-stat">
        <div class="header-stat-value" id="activeJobs">0</div>
        <div class="header-stat-label">Active</div>
      </div>
      <div class="header-stat">
        <div class="header-stat-value" id="sourcesCount">0</div>
        <div class="header-stat-label">Sources</div>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="panel">
      <div class="panel-header">
        Sources
        <span id="sourceFilterCount" style="font-weight:400;text-transform:none;letter-spacing:0"></span>
      </div>
      <div class="panel-body" id="sourceList"></div>
    </div>

    <div class="panel">
      <div class="panel-header">Deadline Range</div>
      <div class="date-inputs">
        <label>From</label>
        <input type="date" id="dateFrom">
        <label>To</label>
        <input type="date" id="dateTo">
      </div>
      <button class="clear-btn" id="clearFilters">Clear filters</button>
    </div>

    <div class="panel">
      <div class="panel-header">Fetch Date</div>
      <div class="fetch-chips" id="fetchChips"></div>
    </div>
  </aside>

  <main class="main">
    <div class="charts-grid">
      <div class="chart-panel">
        <h3>Jobs by Source</h3>
        <div class="chart-container"><canvas id="sourceChart"></canvas></div>
      </div>
      <div class="chart-panel">
        <h3>Deadlines Timeline</h3>
        <div class="chart-container"><canvas id="timelineChart"></canvas></div>
      </div>
    </div>

    <div>
      <div class="jobs-header">
        <h2>Job Listings</h2>
        <span class="jobs-count" id="filteredCount"></span>
      </div>
      <div class="jobs-list" id="jobsList"></div>
    </div>
  </main>
</div>

<script>
const COLORS = [
  '#6c5ce7','#00cec9','#fd79a8','#f39c12','#00b894',
  '#e74c3c','#0984e3','#a29bfe','#55efc4','#fab1a0',
  '#81ecec','#ffeaa7','#dfe6e9','#74b9ff','#ff7675',
  '#636e72','#b2bec3','#fdcb6e','#e17055','#00b894',
  '#e84393','#2d3436','#6c5ce7','#00cec9','#fd79a8',
  '#f39c12','#00b894','#e74c3c','#0984e3'
];

let allJobs = [];
let activeSources = new Set();
let activeFetches = new Set();
let sourceChart = null;
let timelineChart = null;

function parseDate(str) {
  if (!str) return null;
  const [d, m, y] = str.split('.');
  return new Date(y, m - 1, d);
}

function formatDate(str) {
  if (!str) return '';
  const [d, m, y] = str.split('.');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function deadlineStatus(dateStr) {
  if (!dateStr) return { text: 'No deadline', cls: '' };
  const d = parseDate(dateStr);
  const now = new Date();
  const diff = (d - now) / (1000 * 60 * 60 * 24);
  if (diff < 0) return { text: 'Expired', cls: 'deadline-past' };
  if (diff <= 7) return { text: `${Math.ceil(diff)}d left`, cls: 'deadline-soon' };
  return { text: `${Math.ceil(diff)}d left`, cls: 'deadline-future' };
}

function getSourceColor(source) {
  const idx = Object.keys(sourceCounts).indexOf(source) % COLORS.length;
  return COLORS[idx];
}

let sourceCounts = {};

function buildSourceList() {
  sourceCounts = {};
  allJobs.forEach(j => {
    const s = j.source || 'Unknown';
    sourceCounts[s] = (sourceCounts[s] || 0) + 1;
  });

  const sorted = Object.entries(sourceCounts).sort((a, b) => b[1] - a[1]);
  const container = document.getElementById('sourceList');
  container.innerHTML = '';

  sorted.forEach(([source, count]) => {
    const chip = document.createElement('div');
    chip.className = 'source-chip active';
    chip.dataset.source = source;
    chip.innerHTML = `
      <span class="source-dot" style="background:${COLORS[sorted.findIndex(s => s[0]===source) % COLORS.length]}"></span>
      <span class="source-name">${source}</span>
      <span class="source-count">${count}</span>
    `;
    chip.addEventListener('click', () => {
      if (activeSources.size === sorted.length && activeSources.has(source)) {
        activeSources.clear();
      } else if (!activeSources.has(source)) {
        activeSources.add(source);
      } else {
        activeSources.delete(source);
      }
      updateSourceChips();
      render();
    });
    container.appendChild(chip);
    activeSources.add(source);
  });

  document.getElementById('sourcesCount').textContent = sorted.length;
}

function updateSourceChips() {
  document.querySelectorAll('.source-chip').forEach(chip => {
    chip.classList.toggle('active', activeSources.has(chip.dataset.source));
  });
}

function buildFetchChips() {
  const fetches = [...new Set(allJobs.map(j => j._dir))].sort();
  const container = document.getElementById('fetchChips');
  container.innerHTML = '';

  fetches.forEach(f => {
    const chip = document.createElement('button');
    chip.className = 'fetch-chip active';
    chip.textContent = f.replace('jobs_', '');
    chip.dataset.fetch = f;
    chip.addEventListener('click', () => {
      if (activeFetches.has(f)) {
        if (activeFetches.size > 1) activeFetches.delete(f);
      } else {
        activeFetches.add(f);
      }
      updateFetchChips();
      render();
    });
    container.appendChild(chip);
    activeFetches.add(f);
  });
}

function updateFetchChips() {
  document.querySelectorAll('.fetch-chip').forEach(chip => {
    chip.classList.toggle('active', activeFetches.has(chip.dataset.fetch));
  });
}

function getFilteredJobs() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;

  return allJobs.filter(j => {
    if (!activeSources.has(j.source)) return false;
    if (!activeFetches.has(j._dir)) return false;

    if (search) {
      const inTitle = j.title.toLowerCase().includes(search);
      const inSource = (j.source || '').toLowerCase().includes(search);
      if (!inTitle && !inSource) return false;
    }

    if (dateFrom) {
      const d = parseDate(j.date);
      if (!d || d < new Date(dateFrom)) return false;
    }
    if (dateTo) {
      const d = parseDate(j.date);
      if (!d || d > new Date(dateTo + 'T23:59:59')) return false;
    }

    return true;
  });
}

function renderJobs(jobs) {
  const container = document.getElementById('jobsList');
  document.getElementById('filteredCount').textContent = `${jobs.length} of ${allJobs.length} jobs`;

  if (jobs.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <p>No jobs match your filters</p>
      </div>
    `;
    return;
  }

  container.innerHTML = jobs.map((j, i) => {
    const status = deadlineStatus(j.date);
    const color = COLORS[Object.keys(sourceCounts).indexOf(j.source) % COLORS.length];
    return `
      <div class="job-card" style="animation-delay:${Math.min(i * 0.03, 0.5)}s" onclick="openJob('${j._dir}','${j.filename || ''}')">
        <div class="job-source-badge" style="background:${color}"></div>
        <div class="job-info">
          <div class="job-title">${j.title}</div>
          <div class="job-meta">
            <span>${j.source}</span>
            <span>${j._dir.replace('jobs_', '')}</span>
          </div>
        </div>
        <div class="job-deadline">
          <div class="deadline-date">${j.date ? formatDate(j.date) : '—'}</div>
          <div class="deadline-status ${status.cls}">${status.text}</div>
        </div>
      </div>
    `;
  }).join('');
}

function openJob(dir, filename) {
  if (filename) {
    window.open(`${dir}/${filename}`, '_blank');
  }
}

function updateStats(jobs) {
  document.getElementById('totalJobs').textContent = allJobs.length;
  const now = new Date();
  const active = jobs.filter(j => {
    if (!j.date) return true;
    return parseDate(j.date) >= now;
  }).length;
  document.getElementById('activeJobs').textContent = active;
}

function renderCharts(jobs) {
  // Source chart
  const sourceData = {};
  jobs.forEach(j => {
    const s = j.source || 'Unknown';
    sourceData[s] = (sourceData[s] || 0) + 1;
  });

  const sortedSources = Object.entries(sourceData).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const labels = sortedSources.map(s => s[0]);
  const data = sortedSources.map(s => s[1]);
  const colors = labels.map(l => COLORS[Object.keys(sourceCounts).indexOf(l) % COLORS.length]);

  if (sourceChart) sourceChart.destroy();
  sourceChart = new Chart(document.getElementById('sourceChart'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors,
        borderColor: 'transparent',
        borderWidth: 0,
        hoverOffset: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: {
          position: 'right',
          labels: {
            color: '#8888a0',
            font: { size: 10, family: 'Inter' },
            padding: 8,
            boxWidth: 10,
            boxHeight: 10,
            usePointStyle: true
          }
        }
      }
    }
  });

  // Timeline chart
  const deadlineMap = {};
  jobs.forEach(j => {
    if (j.date) {
      const d = parseDate(j.date);
      if (d) {
        const key = d.toISOString().split('T')[0];
        deadlineMap[key] = (deadlineMap[key] || 0) + 1;
      }
    }
  });

  const timelineEntries = Object.entries(deadlineMap).sort((a, b) => a[0].localeCompare(b[0]));
  const tlLabels = timelineEntries.map(e => {
    const d = new Date(e[0]);
    return `${d.getDate()}/${d.getMonth()+1}`;
  });
  const tlData = timelineEntries.map(e => e[1]);

  if (timelineChart) timelineChart.destroy();
  timelineChart = new Chart(document.getElementById('timelineChart'), {
    type: 'bar',
    data: {
      labels: tlLabels,
      datasets: [{
        data: tlData,
        backgroundColor: 'rgba(108, 92, 231, 0.6)',
        borderColor: '#6c5ce7',
        borderWidth: 1,
        borderRadius: 4,
        barPercentage: 0.8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: {
          ticks: { color: '#555568', font: { size: 9, family: 'Inter' }, maxRotation: 45 },
          grid: { color: 'rgba(42,42,58,0.5)' }
        },
        y: {
          ticks: { color: '#555568', font: { size: 9, family: 'Inter' }, stepSize: 1 },
          grid: { color: 'rgba(42,42,58,0.5)' }
        }
      }
    }
  });
}

function render() {
  const jobs = getFilteredJobs();
  updateStats(jobs);
  renderJobs(jobs);
  renderCharts(jobs);
}

// Init
fetch('jobs_data.json')
  .then(r => r.json())
  .then(data => {
    allJobs = data;
    buildSourceList();
    buildFetchChips();
    render();
  })
  .catch(err => {
    document.getElementById('jobsList').innerHTML = `
      <div class="empty-state">
        <p>Failed to load jobs_data.json. Run <code>./generate-data.sh</code> first.</p>
      </div>
    `;
    console.error(err);
  });

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('dateFrom').addEventListener('change', render);
document.getElementById('dateTo').addEventListener('change', render);

document.getElementById('clearFilters').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  activeSources.clear();
  Object.keys(sourceCounts).forEach(s => activeSources.add(s));
  updateSourceChips();
  activeFetches.clear();
  [...new Set(allJobs.map(j => j._dir))].forEach(f => activeFetches.add(f));
  updateFetchChips();
  render();
});
</script>

</body>
</html>
