# Fetch new job ads, rebuild the dashboard, back up notes and tags, and deploy.
#
# Copy into the PRIVATE data repo as .github/workflows/update.yml.
# Runs once a day, and when a council member presses "Fetch now" (max 3 per day).
# Secrets needed in the data repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# They are passed only to the three wrangler steps, never to the steps that install packages or
# read downloaded PDFs. Code running anywhere in a job could still dig them out of the runner's
# memory, so Python packages are installed from requirements.lock with pinned hashes.

name: Update board
run-name: ${{ inputs.source == 'dashboard' && 'Dashboard fetch' || (github.event_name == 'schedule' && 'Scheduled fetch' || 'Manual run') }}

on:
  schedule:
    # Off the full hour on purpose: GitHub may drop scheduled runs that start on the hour when busy.
    - cron: '17 4 * * *'  # 04:17 UTC, about 05:17 or 06:17 in Berlin. GitHub may start it a bit later.
  workflow_dispatch:
    inputs:
      source:
        description: Who started this run
        type: string
        default: manual

permissions:
  contents: write

# Never run two updates at once; a second request waits for the first.
concurrency:
  group: board-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Europe/Berlin
    steps:
      - name: Check out code (public repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: utaysi/uni-job-fetch
          ref: master
          path: code
          persist-credentials: false

      - name: Check out data (this repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: code/data

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes -r code/requirements.lock
          npm ci --prefix code/worker --no-fund --no-audit

      - name: Fetch new ads
        run: python code/src/jobs.py fetch

      - name: Build site
        run: python code/src/jobs.py build-site

      - name: Apply database migrations
        working-directory: code/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote -c ../data/wrangler.toml

      - name: Back up notes and tags
        working-directory: code/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export DB --remote --output ../data/annotations.sql -c ../data/wrangler.toml

      - name: Save data
        working-directory: code/data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit --quiet -m "Update data ($(date '+%Y-%m-%d %H:%M'))"
            git push --quiet
          fi

      - name: Deploy
        working-directory: code/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c ../data/wrangler.toml
