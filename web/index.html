<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni Marburg Jobs Dashboard</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --bg-elevated: #12121a;
  --bg-card: #1a1a26;
  --bg-card-hover: #22222f;
  --border: #2a2a3a;
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --text-muted: #555568;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --accent-glow: rgba(108, 92, 231, 0.15);
  --green: #00b894;
  --orange: #f39c12;
  --red: #e74c3c;
  --pink: #fd79a8;
  --cyan: #00cec9;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.logo {
  font-size: 1.25rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent-light), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

.search-box {
  flex: 1;
  min-width: 200px;
  max-width: 400px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 0.6rem 1rem 0.6rem 2.5rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.875rem;
  font-family: inherit;
  outline: none;
  transition: var(--transition);
}

.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-box svg {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}

.header-stats {
  display: flex;
  gap: 1.5rem;
  margin-left: auto;
}

.header-stat {
  text-align: center;
}

.header-stat-value {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--accent-light);
}

.header-stat-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

/* Layout */
.layout {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 1.5rem;
  min-height: calc(100vh - 65px);
}

@media (max-width: 900px) {
  .layout {
    /* minmax(0, ...) lets the column shrink below long department names. */
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Sidebar */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.panel-header {
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-body {
  padding: 0.5rem;
  max-height: 400px;
  overflow-y: auto;
}

/* Source chips */
.source-chip {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.5rem 0.625rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
  font-size: 0.8125rem;
}

.source-chip:hover {
  background: var(--bg-card-hover);
}

.source-chip.active {
  background: var(--accent-glow);
}

.source-chip:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.source-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* The "All" row: a dot with every color, and a little space under it. */
.source-dot.all {
  background: conic-gradient(var(--accent-light), var(--cyan), var(--green), var(--orange), var(--pink), var(--accent-light));
}

.source-chip.source-all {
  margin-bottom: 0.25rem;
  font-weight: 600;
}

.source-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-dim);
  transition: var(--transition);
}

.source-chip.active .source-name {
  color: var(--text);
}

.source-count {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg-elevated);
  padding: 0.125rem 0.5rem;
  border-radius: 99px;
  flex-shrink: 0;
}

.source-chip.active .source-count {
  background: var(--accent);
  color: white;
}

/* Date filter */
.date-inputs {
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.date-inputs label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.date-inputs input[type="date"] {
  width: 100%;
  padding: 0.5rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 0.8125rem;
  outline: none;
  transition: var(--transition);
}

.date-inputs input[type="date"]:focus {
  border-color: var(--accent);
}

/* Contract filters: a min and max box per value, both ends included. */
.range-filters {
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.875rem;
}

.range {
  border: none;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
}

.range legend {
  margin-bottom: 0.375rem;
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.range-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.range-row input,
.term-form input[type="number"] {
  flex: 1;
  min-width: 0;
  padding: 0.4rem 0.5rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 0.8125rem;
  outline: none;
  color-scheme: dark;
  transition: var(--transition);
}

.range-row input:focus { border-color: var(--accent); }

.range-check {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.75rem;
  color: var(--text-dim);
  cursor: pointer;
}

.range-check input { accent-color: var(--accent); }

.clear-btn {
  margin: 0.5rem 0.75rem 0.75rem;
  padding: 0.4rem 0.75rem;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.75rem;
  cursor: pointer;
  transition: var(--transition);
}

.clear-btn:hover {
  border-color: var(--red);
  color: var(--red);
}

/* Members panel (owner only): one row per member, opens to show their recent logins. */
.panel-header-note {
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
  color: var(--text-muted);
}

.member summary {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.5rem 0.625rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  list-style: none;
  font-size: 0.8125rem;
  transition: var(--transition);
}

.member summary::-webkit-details-marker { display: none; }

/* A small chevron that turns down when the row is open. */
.member summary::before {
  content: '';
  width: 5px;
  height: 5px;
  border-right: 1.5px solid var(--text-muted);
  border-bottom: 1.5px solid var(--text-muted);
  transform: rotate(-45deg);
  transition: transform var(--transition);
  flex-shrink: 0;
}

.member[open] summary::before { transform: rotate(45deg); }
.member summary:hover { background: var(--bg-card-hover); }
.member[open] summary { background: var(--accent-glow); }

.member summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.member-name {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}

.member-seen {
  font-size: 0.75rem;
  color: var(--text-dim);
  flex-shrink: 0;
}

.member-seen.today { color: var(--green); }

.member-body {
  padding: 0.375rem 0.625rem 0.625rem 1.5rem;
  font-size: 0.75rem;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
}

.member-email {
  color: var(--text);
  overflow-wrap: anywhere;
}

.member-logins {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.member-logins li {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  column-gap: 0.5rem;
}

.member-until,
.members-empty { color: var(--text-muted); }

.members-empty {
  padding: 0.5rem 0.625rem;
  font-size: 0.8125rem;
}

/* Main content */
.main {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* Charts */
.charts-grid {
  display: grid;
  /* minmax(0, ...) lets the charts shrink when the window gets narrower. */
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 1.5rem;
}

@media (max-width: 700px) {
  .charts-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

.chart-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
}

.chart-panel h3 {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
}

.chart-container {
  position: relative;
  height: 220px;
}

/* Jobs list */
.jobs-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.5rem;
}

.jobs-header h2 {
  font-size: 1rem;
  font-weight: 600;
}

.jobs-count {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.jobs-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.job-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  gap: 1rem;
  align-items: center;
  transition: var(--transition);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

.job-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.job-source-badge {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.job-info {
  min-width: 0;
}

.job-title-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

.job-title {
  font-size: 0.875rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

/* Notes count next to the title */
.note-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  flex-shrink: 0;
  padding: 0.1rem 0.5rem;
  background: rgba(0, 206, 201, 0.15);
  border: 1px solid var(--cyan);
  border-radius: 99px;
  color: var(--cyan);
  font-size: 0.75rem;
  font-weight: 700;
  line-height: 1.4;
}

.note-badge svg { width: 13px; height: 13px; }

.job-meta {
  display: flex;
  gap: 1rem;
  margin-top: 0.25rem;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.job-meta span {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

/* Deadline and first seen, one per line. Fixed column widths keep the dates
   lined up from card to card. */
.job-dates {
  display: grid;
  grid-template-columns: 4.25rem 5.75rem 4rem;
  column-gap: 0.5rem;
  row-gap: 0.125rem;
  align-items: baseline;
  flex-shrink: 0;
}

.date-label {
  font-size: 0.625rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.deadline-date,
.seen-date {
  font-size: 0.8125rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.deadline-date { font-weight: 600; }
.deadline-date.open { font-weight: 500; color: var(--text-dim); }
.deadline-date.wide,
.seen-date { grid-column: span 2; }
.seen-date { color: var(--text-dim); }

.deadline-status {
  font-size: 0.6875rem;
  white-space: nowrap;
}

/* Contract duration and hours per month, under the dates. */
.terms {
  grid-column: span 2;
  font-size: 0.8125rem;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.term.unknown { color: var(--text-muted); }
.terms-sep { margin: 0 0.3rem; color: var(--text-muted); }

.deadline-future { color: var(--green); }
.deadline-soon { color: var(--orange); }
.deadline-past { color: var(--red); }

.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}

.empty-state svg {
  width: 48px;
  height: 48px;
  margin-bottom: 1rem;
  opacity: 0.3;
}

.empty-state p {
  font-size: 0.875rem;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.job-card {
  animation: fadeIn 0.3s ease both;
}

/* Responsive */
@media (max-width: 600px) {
  .header-inner { gap: 0.75rem; }
  .header-stats { gap: 1rem; }
  .header-stat-value { font-size: 1rem; }
  .layout { padding: 1rem; gap: 1rem; }
  .job-card { padding: 0.875rem 1rem; }
}

/* Fetch date filter */
.fetch-chips {
  padding: 0.5rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem;
}

.fetch-chip {
  padding: 0.3rem 0.625rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 0.6875rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.fetch-chip:hover {
  border-color: var(--accent);
}

.fetch-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.fetch-chip.untagged:not(.active) { border-style: dashed; }

/* Toggle charts */
.toggle-charts {
  padding: 0.5rem 0.75rem;
  display: flex;
  gap: 0.5rem;
  border-top: 1px solid var(--border);
}

.toggle-btn {
  flex: 1;
  padding: 0.4rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.75rem;
  cursor: pointer;
  transition: var(--transition);
}

.toggle-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

[hidden] { display: none !important; }

.muted { color: var(--text-muted); font-size: 0.8125rem; }

/* Last fetched + fetch button */
.header-stat-value.small {
  font-size: 0.8125rem;
  line-height: 1.9rem;
  white-space: nowrap;
}

.fetch-ctl {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.fetch-info {
  display: flex;
  flex-direction: column;
  line-height: 1.35;
}

.fetch-left {
  font-size: 0.75rem;
  color: var(--text-muted);
  white-space: nowrap;
}

/* Small note that a fetch also runs by itself every day. */
.fetch-auto {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.6875rem;
  color: var(--cyan);
  white-space: nowrap;
  cursor: help;
}

.fetch-auto svg { width: 11px; height: 11px; flex-shrink: 0; }

.action-btn {
  padding: 0.45rem 0.875rem;
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  color: white;
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: var(--transition);
}

.action-btn:hover:not(:disabled) { background: var(--accent-light); border-color: var(--accent-light); }
.action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.action-btn.small { padding: 0.3rem 0.625rem; font-size: 0.75rem; }

.link-btn {
  background: none;
  border: none;
  padding: 0;
  color: var(--accent-light);
  font-family: inherit;
  font-size: 0.75rem;
  cursor: pointer;
}

.link-btn:hover { text-decoration: underline; }
.link-btn.danger { color: var(--red); }

/* Job cards: actions, tags, details */
.job-card.no-anim { animation: none; }
.job-card.expanded { border-color: var(--accent); cursor: default; }
.job-card.expanded:hover { transform: none; }

.job-actions { flex-shrink: 0; }

.job-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem;
  margin-top: 0.4rem;
}

.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.1rem 0.55rem;
  background: var(--accent-glow);
  border: 1px solid var(--accent);
  border-radius: 99px;
  font-size: 0.6875rem;
  color: var(--accent-light);
  max-width: 100%;
  overflow-wrap: anywhere;
}

.tag-remove {
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  font-size: 0.875rem;
  line-height: 1;
  padding: 0 0.1rem;
}

.tag-remove:hover { color: var(--red); }

/* Needs review mark in the opened card */
.review-chip {
  background: rgba(243, 156, 18, 0.12);
  border-color: var(--orange);
  color: var(--orange);
}

.review-add {
  padding: 0.1rem 0.55rem;
  background: none;
  border: 1px dashed var(--orange);
  border-radius: 99px;
  color: var(--orange);
  font-family: inherit;
  font-size: 0.6875rem;
  cursor: pointer;
}

.review-add:hover { background: rgba(243, 156, 18, 0.12); }
.review-add:disabled { opacity: 0.45; cursor: not-allowed; }

.review-by {
  margin-top: 0.3rem;
  font-size: 0.6875rem;
  color: var(--text-muted);
}

.details-block h4.spaced { margin-top: 1rem; }

/* Deadline correction in the opened card */
.detected {
  font-size: 0.75rem;
  color: var(--text-dim);
  overflow-wrap: anywhere;
}

.deadline-form { flex-wrap: wrap; align-items: center; }

/* Duration and hours in the opened card */
.term-edit + .term-edit { margin-top: 0.75rem; }
.term-basis { margin-top: 0.15rem; font-size: 0.6875rem; color: var(--text-muted); overflow-wrap: anywhere; }
.term-form { align-items: center; }
.term-form input[type="number"] { flex: 0 1 6rem; }
.term-unit { font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; }
.deadline-form input[type="date"] { flex: 0 1 10rem; color-scheme: dark; }

.job-details {
  grid-column: 1 / -1;
  border-top: 1px solid var(--border);
  padding-top: 0.875rem;
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 1.25rem;
  cursor: auto;
}

.details-block h4 {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 0.5rem;
}

.inline-form {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.625rem;
}

.inline-form input,
.note-form textarea {
  flex: 1;
  min-width: 0;
  padding: 0.4rem 0.6rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 0.8125rem;
  outline: none;
}

.inline-form input:focus,
.note-form textarea:focus { border-color: var(--accent); }

.note-form {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.5rem;
  margin-top: 0.625rem;
}

.note-form textarea { width: 100%; resize: vertical; }

.note-buttons { display: flex; align-items: center; gap: 0.75rem; }

.notes {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

.note {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.5rem 0.75rem;
}

.note-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.625rem;
  font-size: 0.75rem;
}

.note-author { font-weight: 600; color: var(--text); }
.note-time { color: var(--text-muted); margin-right: auto; }

.note-text {
  margin-top: 0.25rem;
  font-size: 0.8125rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 1.5rem;
  transform: translateX(-50%);
  max-width: calc(100vw - 2rem);
  padding: 0.625rem 1rem;
  background: var(--bg-card-hover);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  font-size: 0.8125rem;
  z-index: 200;
}

.toast.error { border-color: var(--red); }

@media (max-width: 700px) {
  .job-details { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  /* Title and PDF button on the first row, dates on the second. */
  .job-card { grid-template-columns: auto 1fr auto; row-gap: 0.625rem; }
  .job-dates { grid-column: 2 / -1; grid-row: 2; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">Uni Jobs</div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search jobs...">
    </div>
    <div class="header-stats">
      <div class="header-stat">
        <div class="header-stat-value" id="totalJobs">0</div>
        <div class="header-stat-label">Total</div>
      </div>
      <div class="header-stat">
        <div class="header-stat-value" id="activeJobs">0</div>
        <div class="header-stat-label">Active</div>
      </div>
      <div class="header-stat">
        <div class="header-stat-value" id="sourcesCount">0</div>
        <div class="header-stat-label">Departments</div>
      </div>
      <div class="header-stat" title="Time of the last successful fetch (Berlin time)">
        <div class="header-stat-value small" id="lastFetched">-</div>
        <div class="header-stat-label">Last fetched</div>
      </div>
    </div>
    <div class="fetch-ctl" id="fetchCtl" hidden>
      <button class="action-btn" id="fetchBtn" type="button" hidden>Fetch now</button>
      <div class="fetch-info">
        <span class="fetch-left" id="fetchLeft" hidden></span>
        <span class="fetch-auto" title="The board also fetches new ads by itself once a day, early in the morning (Berlin time). These automatic fetches do not count toward the daily Fetch now limit.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
          Auto-fetch every 24 h
        </span>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="panel">
      <div class="panel-header">
        Departments
        <span id="sourceFilterCount" style="font-weight:400;text-transform:none;letter-spacing:0"></span>
      </div>
      <div class="panel-body" id="sourceList"></div>
    </div>

    <div class="panel" id="tagPanel" hidden>
      <div class="panel-header">Tags</div>
      <div class="fetch-chips" id="tagChips"></div>
    </div>

    <div class="panel">
      <div class="panel-header">Sort by</div>
      <div class="fetch-chips" id="sortChips"></div>
    </div>

    <div class="panel">
      <div class="panel-header">Status</div>
      <div class="fetch-chips" id="fetchChips"></div>
    </div>

    <div class="panel">
      <div class="panel-header">Contract</div>
      <div class="range-filters">
        <fieldset class="range">
          <legend>Duration (months)</legend>
          <div class="range-row">
            <input type="number" id="durationMin" min="0" step="any" inputmode="decimal" placeholder="Min" aria-label="Minimum duration in months">
            <span>to</span>
            <input type="number" id="durationMax" min="0" step="any" inputmode="decimal" placeholder="Max" aria-label="Maximum duration in months">
          </div>
          <label class="range-check"><input type="checkbox" id="durationUnknown" checked> Include ads without a value</label>
        </fieldset>
        <fieldset class="range">
          <legend>Hours per month</legend>
          <div class="range-row">
            <input type="number" id="hoursMin" min="0" step="any" inputmode="decimal" placeholder="Min" aria-label="Minimum hours per month">
            <span>to</span>
            <input type="number" id="hoursMax" min="0" step="any" inputmode="decimal" placeholder="Max" aria-label="Maximum hours per month">
          </div>
          <label class="range-check"><input type="checkbox" id="hoursUnknown" checked> Include ads without a value</label>
        </fieldset>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Deadline Range</div>
      <div class="date-inputs">
        <label for="dateFrom">From</label>
        <input type="date" id="dateFrom">
        <label for="dateTo">To</label>
        <input type="date" id="dateTo">
      </div>
      <button class="clear-btn" id="clearFilters">Clear filters</button>
    </div>

    <!-- Shown only to ADMIN_EMAILS; the Worker refuses api/logins to everyone else. -->
    <div class="panel" id="membersPanel" hidden>
      <div class="panel-header">
        Members
        <span class="panel-header-note">Only you see this</span>
      </div>
      <div class="panel-body" id="membersList"></div>
    </div>
  </aside>

  <main class="main">
    <div class="charts-grid">
      <div class="chart-panel">
        <h3>Jobs by Department</h3>
        <div class="chart-container"><canvas id="sourceChart"></canvas></div>
      </div>
      <div class="chart-panel">
        <h3>Deadlines Timeline</h3>
        <div class="chart-container"><canvas id="timelineChart"></canvas></div>
      </div>
    </div>

    <div>
      <div class="jobs-header">
        <h2>Job Listings</h2>
        <span class="jobs-count" id="filteredCount"></span>
      </div>
      <div class="jobs-list" id="jobsList"></div>
    </div>
  </main>
</div>

<datalist id="tagSuggestions"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/chart-4.4.7.umd.js"></script>
<script src="app.js"></script>

</body>
</html>
